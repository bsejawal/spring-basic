spring:
  application:
    name: file-upload
  codec:
    # Cap any in-memory buffering across reactive codecs (JSON, multipart headers, form fields).
    # File content streams as PartEvents through to disk and is not bounded by this.
    max-in-memory-size: 1MB

aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: bsejawal
    folder: uploads
    path-style-access: true
